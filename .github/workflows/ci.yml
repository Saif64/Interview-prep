name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run every JavaScript solution's self-check
        run: node tools/test.js

      - name: Every JavaScript file parses
        run: |
          set -e
          find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' \
            -print0 | xargs -0 -n1 node --check

  kotlin:
    name: Kotlin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Kotlin
        run: |
          curl -sSLo kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kotlin.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Compile and run every Kotlin solution
        run: node tools/test-kotlin.js

  indexes:
    name: Indexes are current
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate and diff
        run: |
          node tools/build-index.js
          git diff --exit-code -- SOLUTIONS.md neetcode-150/README.md \
            || { echo "::error::Indexes are stale. Run 'node tools/build-index.js' and commit."; exit 1; }
